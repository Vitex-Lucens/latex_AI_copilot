[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-copilot"
dynamic = ["version"]
description = "Overleaf-style local LaTeX editor with Claude built in: chat, PDF annotation, multi-file projects."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Vitex-Lucens/latex_AI_copilot"

[project.scripts]
latex-copilot = "latex_copilot.app:main"

[tool.setuptools]
packages = ["latex_copilot"]

[tool.setuptools.dynamic]
version = { attr = "latex_copilot.__version__" }

[tool.setuptools.package-data]
latex_copilot = ["static/*.html", "static/*.js", "static/*.png", "static/*.ico", "static/*.icns", "*.pyw", "static/vendor/*", "prompts/*.md"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tex-annotator"
dynamic = ["version"]
description = "Overleaf-style local LaTeX editor with Claude built in: chat, PDF annotation, multi-file projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tex-annotator = "tex_annotator.app:main"

[tool.setuptools]
packages = ["tex_annotator"]

[tool.setuptools.dynamic]
version = { attr = "tex_annotator.__version__" }

[tool.setuptools.package-data]
tex_annotator = ["static/*.html", "static/vendor/*"]

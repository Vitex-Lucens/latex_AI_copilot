# Installs latex-copilot on Windows, macOS and Ubuntu the way users do, then runs tests/smoke_test.py
# (compiling, SyncTeX, PDF import, the server). Claude Code isn't installed here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:        # by the release workflow, before it publishes anything

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4   # runs the browser's pdf.js text extraction in the test
        with:
          node-version: "20"

      # ---- Ubuntu: install.sh installs TeX and Ghostscript itself (apt), as for users
      - name: install.sh (Ubuntu, with prerequisites)
        if: runner.os == 'Linux'
        env:
          LATEX_COPILOT_YES: "1"
          LATEX_COPILOT_NO_CLAUDE: "1"
        run: ./install.sh

      # ---- macOS: BasicTeX instead of MacTeX (5 GB is too slow for CI), then install.sh for the app
      - name: TeX and Ghostscript (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask basictex
          brew install ghostscript
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          export PATH="/Library/TeX/texbin:$PATH"
          sudo tlmgr update --self
          sudo tlmgr install latexmk synctex pgf geometry xcolor
      - name: install.sh (macOS)
        if: runner.os == 'macOS'
        env:
          LATEX_COPILOT_SKIP_PREREQS: "1"
        run: ./install.sh

      # ---- Windows: install.ps1 first (it doesn't need TeX), then the same TeX set-up install.ps1 makes for
      # users (MiKTeX installing packages on demand, Perl for latexmk, Ghostscript in Program Files), with
      # Chocolatey because CI machines have no winget
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          LATEX_COPILOT_SKIP_PREREQS: "1"
        # an error in install.ps1 still fails the step; `exit 0` only drops the exit code of its final
        # `latex-copilot --check`, which reports Claude Code missing here
        run: |
          try { .\install.ps1 } catch { Write-Host ("::error title=install.ps1::" + ("$_`n" + $_.ScriptStackTrace).Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")); exit 1 }
          exit 0

      - name: latex-copilot --version (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $out = & "$env:LOCALAPPDATA\latex-copilot\bin\latex-copilot.cmd" --version
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or "$out" -notmatch "latex-copilot \d") {
            Write-Host "::error title=Windows launcher::latex-copilot --version failed: $out"
            exit 1
          }
          & "$env:LOCALAPPDATA\latex-copilot\bin\latex-copilot.cmd" --check
          exit 0   # --check reports Claude Code missing on CI
      - name: one-line install (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: powershell
        env:
          LATEX_COPILOT_REF: ${{ github.sha }}
          LATEX_COPILOT_SKIP_PREREQS: "1"
        run: |
          try { irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex } catch { Write-Host ("::error title=one-line install.ps1::" + ("$_`n" + $_.ScriptStackTrace).Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")); exit 1 }
          exit 0
      - name: TeX, Perl and Ghostscript (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Each step's output goes into an annotation if it fails (the run page shows those without a login).
          function Step([string]$what, [scriptblock]$cmd) {
            Write-Host "--- $what"
            $out = & $cmd 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              $tail = (($out.Trim() -split "`r?`n") | Select-Object -Last 40) -join "`n"
              $msg = "$what (exit $LASTEXITCODE)`n$tail"
              Write-Host ("::error title=Windows TeX setup::" + $msg.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A"))
              exit 1
            }
          }
          # MiKTeX's Chocolatey package downloads from a random mirror and sometimes fails: try three times
          foreach ($try in 1..3) {
            choco install miktex ghostscript --no-progress -y | Out-Host
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco failed (attempt $try), retrying..."
            Start-Sleep -Seconds 20
          }
          Step "choco install miktex ghostscript" { choco install miktex ghostscript --no-progress -y }
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            Step "choco install strawberryperl" { choco install strawberryperl --no-progress -y }
          }
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          if (-not (Test-Path "$bin\latexmk.exe")) {
            $found = Get-ChildItem "C:\Program Files\MiKTeX", "$env:LOCALAPPDATA\Programs\MiKTeX" -Recurse -Filter latexmk.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $bin = $found.DirectoryName }
          }
          $env:Path = "$bin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Step "initexmf --admin AutoInstall" { initexmf --admin --set-config-value=[MPM]AutoInstall=1 }
          Step "initexmf AutoInstall" { initexmf --set-config-value=[MPM]AutoInstall=1 }
          Step "miktex update-package-database" { miktex --admin packages update-package-database }
          # the test documents' packages, installed now so a flaky mirror can't fail the test later
          # (one at a time: MiKTeX fails the whole command if any of them is already installed)
          foreach ($pkg in "geometry", "pgf", "xcolor", "graphics", "tools", "latexmk") {
            miktex --admin packages install $pkg 2>&1 | Out-Host
          }
          Step "latexmk --version" { latexmk --version }
      # ---- the installed command works
      - name: latex-copilot --version (macOS, Ubuntu)
        if: runner.os != 'Windows'
        run: |
          "$HOME/.local/bin/latex-copilot" --version | grep -E "^latex-copilot [0-9]"
          "$HOME/.local/bin/latex-copilot" --check || true   # reports Claude Code missing on CI
      # ---- the app icon each installer makes (its folder dialog needs a person, so it isn't opened here)
      - name: app icon (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          f="$HOME/.local/share/applications/latex-copilot.desktop"
          cat "$f"
          grep -qx "Exec=\"$HOME/.local/bin/latex-copilot\" --launch" "$f"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/latex-copilot.png"
          if command -v desktop-file-validate >/dev/null; then desktop-file-validate "$f"; fi
      - name: app icon (macOS)
        if: runner.os == 'macOS'
        run: |
          app="$HOME/Applications/Latex-Copilot.app"
          plutil -lint "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleName" "$app/Contents/Info.plist" | grep -qx "Latex-Copilot"
          codesign --verify --deep --strict "$app"
          osadecompile "$app/Contents/Resources/Scripts/main.scpt" | tee /dev/stderr | grep -q -- "--launch"
          cmp "$app/Contents/Resources/applet.icns" "$HOME/.local/share/latex-copilot/latex_copilot/static/icon.icns"
      - name: app icon (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $wsh = New-Object -ComObject WScript.Shell
          foreach ($dir in @([Environment]::GetFolderPath("Programs"), [Environment]::GetFolderPath("Desktop"))) {
            $lnk = $wsh.CreateShortcut((Join-Path $dir "Latex-Copilot.lnk"))
            Write-Host "$dir : $($lnk.TargetPath) $($lnk.Arguments) | icon $($lnk.IconLocation)"
            if ($lnk.TargetPath -notmatch "pythonw\.exe$" -or -not (Test-Path $lnk.TargetPath)) {
              Write-Host "::error title=Windows shortcut::no working shortcut in $dir"
              exit 1
            }
          }
          # what the shortcut runs starts the app (--version here, so no folder dialog)
          $python = Join-Path (Split-Path $lnk.TargetPath) "python.exe"
          $out = & $python -X utf8 "$env:LOCALAPPDATA\latex-copilot\app\latex_copilot\launch.pyw" --version
          Write-Host $out
          if ("$out" -notmatch "latex-copilot \d") { Write-Host "::error title=launch.pyw::$out"; exit 1 }

      # ---- the one-line installs, exactly as in the README (this commit, downloaded from GitHub)
      - name: one-line install (macOS, Ubuntu)
        if: runner.os != 'Windows' && github.event_name == 'push'
        env:
          LATEX_COPILOT_REF: ${{ github.sha }}
          LATEX_COPILOT_SKIP_PREREQS: "1"
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | bash
      - name: Smoke test
        run: python tests/smoke_test.py
